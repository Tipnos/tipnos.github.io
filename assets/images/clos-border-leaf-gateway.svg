<svg width="1300" height="1000" viewBox="0 0 1300 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto Mono','IBM Plex Mono',monospace">
  <rect x="0" y="0" width="1300" height="1000" fill="#202124"/>

  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f1f1">2-Tier Clos Fabric with Border Leaf &amp; Border Gateway</text>
  <text x="650" y="56" text-anchor="middle" font-size="13" fill="#9aa0a6">EVPN/VXLAN underlay &amp; overlay reference topology</text>

  <!-- Full mesh spine-leaf links -->
  <g stroke="#55606b" stroke-width="1.5" opacity="0.55">
    <line x1="400" y1="545" x2="150" y2="685"/>
    <line x1="400" y1="545" x2="400" y2="685"/>
    <line x1="400" y1="545" x2="650" y2="685"/>
    <line x1="400" y1="545" x2="900" y2="685"/>
    <line x1="400" y1="545" x2="1150" y2="685"/>
    <line x1="650" y1="545" x2="150" y2="685"/>
    <line x1="650" y1="545" x2="400" y2="685"/>
    <line x1="650" y1="545" x2="650" y2="685"/>
    <line x1="650" y1="545" x2="900" y2="685"/>
    <line x1="650" y1="545" x2="1150" y2="685"/>
    <line x1="900" y1="545" x2="150" y2="685"/>
    <line x1="900" y1="545" x2="400" y2="685"/>
    <line x1="900" y1="545" x2="650" y2="685"/>
    <line x1="900" y1="545" x2="900" y2="685"/>
    <line x1="900" y1="545" x2="1150" y2="685"/>
  </g>

  <!-- Border leaf -> border gateway uplinks: each border leaf dual-homed to both gateways -->
  <g fill="none" stroke="#ff79c6" stroke-width="2.2">
    <!-- Border Leaf-1 -> BGW-1 (direct) -->
    <line x1="150" y1="685" x2="150" y2="335"/>
    <!-- Border Leaf-2 -> BGW-2 (direct) -->
    <line x1="1150" y1="685" x2="1150" y2="335"/>
    <!-- Border Leaf-1 -> BGW-2 (cross link) -->
    <path d="M 170,685 L 170,420 L 1170,420 L 1170,335"/>
    <!-- Border Leaf-2 -> BGW-1 (cross link) -->
    <path d="M 1130,685 L 1130,390 L 130,390 L 130,335"/>
  </g>

  <!-- Internet -> BGW links -->
  <line x1="650" y1="206" x2="150" y2="265" stroke="#bd93f9" stroke-width="2"/>
  <line x1="650" y1="206" x2="1150" y2="265" stroke="#bd93f9" stroke-width="2"/>

  <!-- Internet cloud -->
  <g transform="translate(550,90) scale(2)">
    <path d="M 25,60 C 10,60 0,50 0,38 C 0,27 8,18 19,16 C 21,7 29,0 40,0 C 50,0 58,6 61,15 C 70,13 80,20 80,30 C 92,30 100,38 100,48 C 100,55 93,60 85,60 Z"
          fill="#2a2438" stroke="#bd93f9" stroke-width="1.6"/>
  </g>
  <text x="650" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#e6d9ff">Internet</text>

  <!-- Border Gateways -->
  <g>
    <rect x="55" y="265" width="190" height="70" rx="8" fill="#2e1f28" stroke="#ff79c6" stroke-width="1.8"/>
    <text x="150" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#ffd6ec">BGW-1</text>
  </g>
  <g>
    <rect x="1055" y="265" width="190" height="70" rx="8" fill="#2e1f28" stroke="#ff79c6" stroke-width="1.8"/>
    <text x="1150" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#ffd6ec">BGW-2</text>
  </g>

  <!-- Spines (Tier 2) -->
  <g>
    <rect x="305" y="475" width="190" height="70" rx="8" fill="#23272e" stroke="#8be9fd" stroke-width="1.8"/>
    <text x="400" y="515" text-anchor="middle" font-size="16" font-weight="700" fill="#dff9ff">Spine-1</text>
  </g>
  <g>
    <rect x="555" y="475" width="190" height="70" rx="8" fill="#23272e" stroke="#8be9fd" stroke-width="1.8"/>
    <text x="650" y="515" text-anchor="middle" font-size="16" font-weight="700" fill="#dff9ff">Spine-2</text>
  </g>
  <g>
    <rect x="805" y="475" width="190" height="70" rx="8" fill="#23272e" stroke="#8be9fd" stroke-width="1.8"/>
    <text x="900" y="515" text-anchor="middle" font-size="16" font-weight="700" fill="#dff9ff">Spine-3</text>
  </g>

  <!-- Leaves (Tier 1), including Border Leaves at the edges -->
  <g>
    <rect x="65" y="685" width="170" height="70" rx="8" fill="#1f2e22" stroke="#50fa7b" stroke-width="1.8"/>
    <text x="150" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#dcffe6">Border Leaf-1</text>
  </g>
  <g>
    <rect x="315" y="685" width="170" height="70" rx="8" fill="#23272e" stroke="#f1fa8c" stroke-width="1.8"/>
    <text x="400" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#fbffe0">Leaf-1</text>
  </g>
  <g>
    <rect x="565" y="685" width="170" height="70" rx="8" fill="#23272e" stroke="#f1fa8c" stroke-width="1.8"/>
    <text x="650" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#fbffe0">Leaf-2</text>
  </g>
  <g>
    <rect x="815" y="685" width="170" height="70" rx="8" fill="#23272e" stroke="#f1fa8c" stroke-width="1.8"/>
    <text x="900" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#fbffe0">Leaf-3</text>
  </g>
  <g>
    <rect x="1065" y="685" width="170" height="70" rx="8" fill="#1f2e22" stroke="#50fa7b" stroke-width="1.8"/>
    <text x="1150" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#dcffe6">Border Leaf-2</text>
  </g>

  <!-- Racks / tenants under compute leaves -->
  <g stroke="#55606b" stroke-width="1.5">
    <line x1="400" y1="755" x2="400" y2="865"/>
    <line x1="650" y1="755" x2="650" y2="865"/>
    <line x1="900" y1="755" x2="900" y2="865"/>
  </g>
  <g>
    <rect x="355" y="865" width="90" height="50" rx="6" fill="#23272e" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="355" y1="882" x2="445" y2="882" stroke="#6b7280"/>
    <line x1="355" y1="898" x2="445" y2="898" stroke="#6b7280"/>
    <text x="400" y="875" text-anchor="middle" font-size="10.5" fill="#dcdcdc">Tenant A</text>
  </g>
  <g>
    <rect x="605" y="865" width="90" height="50" rx="6" fill="#23272e" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="605" y1="882" x2="695" y2="882" stroke="#6b7280"/>
    <line x1="605" y1="898" x2="695" y2="898" stroke="#6b7280"/>
    <text x="650" y="875" text-anchor="middle" font-size="10.5" fill="#dcdcdc">Tenant B</text>
  </g>
  <g>
    <rect x="855" y="865" width="90" height="50" rx="6" fill="#23272e" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="855" y1="882" x2="945" y2="882" stroke="#6b7280"/>
    <line x1="855" y1="898" x2="945" y2="898" stroke="#6b7280"/>
    <text x="900" y="875" text-anchor="middle" font-size="10.5" fill="#dcdcdc">Tenant C</text>
  </g>

  <!-- Legend -->
  <g font-size="11.5" fill="#dcdcdc">
    <rect x="90" y="948" width="16" height="16" rx="3" fill="#23272e" stroke="#8be9fd" stroke-width="1.6"/>
    <text x="114" y="961">Spine</text>

    <rect x="230" y="948" width="16" height="16" rx="3" fill="#23272e" stroke="#f1fa8c" stroke-width="1.6"/>
    <text x="254" y="961">Compute Leaf</text>

    <rect x="430" y="948" width="16" height="16" rx="3" fill="#1f2e22" stroke="#50fa7b" stroke-width="1.6"/>
    <text x="454" y="961">Border Leaf</text>

    <rect x="620" y="948" width="16" height="16" rx="3" fill="#2e1f28" stroke="#ff79c6" stroke-width="1.6"/>
    <text x="644" y="961">Border Gateway</text>

    <rect x="850" y="948" width="16" height="16" rx="3" fill="#2a2438" stroke="#bd93f9" stroke-width="1.6"/>
    <text x="874" y="961">Internet / WAN</text>
  </g>
</svg>
