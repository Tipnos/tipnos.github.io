<svg width="1360" height="800" viewBox="0 0 1360 800" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto Mono','IBM Plex Mono',monospace">
  <rect x="0" y="0" width="1360" height="800" fill="#202124"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d7dae0"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5555"/>
    </marker>
  </defs>

  <text x="680" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f1f1">BGP Finite State Machine</text>
  <text x="680" y="56" text-anchor="middle" font-size="13" fill="#9aa0a6">Session establishment phases referenced in this article</text>

  <!-- Phase groupings -->
  <ellipse cx="235" cy="450" rx="205" ry="215" fill="#8be9fd" opacity="0.10"/>
  <text x="60" y="222" font-size="14" font-weight="700" fill="#8be9fd">TCP Connection</text>
  <text x="60" y="240" font-size="14" font-weight="700" fill="#8be9fd">Establishment</text>

  <ellipse cx="670" cy="560" rx="285" ry="150" fill="#bd93f9" opacity="0.10"/>
  <text x="490" y="700" font-size="14" font-weight="700" fill="#bd93f9">Capability Exchange &amp;</text>
  <text x="490" y="718" font-size="14" font-weight="700" fill="#bd93f9">Collision Handling</text>

  <ellipse cx="1105" cy="420" rx="210" ry="190" fill="#50fa7b" opacity="0.10"/>
  <text x="1005" y="700" font-size="14" font-weight="700" fill="#50fa7b">Route Exchange Phase</text>

  <!-- ===== Nodes ===== -->
  <!-- Idle -->
  <rect x="605" y="150" width="150" height="58" rx="8" fill="#2a2a34" stroke="#f1fa8c" stroke-width="1.8"/>
  <text x="680" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#fbffe0">Idle</text>

  <!-- Connect -->
  <rect x="150" y="360" width="160" height="58" rx="8" fill="#1c2a30" stroke="#8be9fd" stroke-width="1.8"/>
  <text x="230" y="395" text-anchor="middle" font-size="15" font-weight="700" fill="#dff9ff">Connect</text>

  <!-- Active -->
  <rect x="150" y="520" width="160" height="58" rx="8" fill="#1c2a30" stroke="#8be9fd" stroke-width="1.8"/>
  <text x="230" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#dff9ff">Active</text>

  <!-- OpenSent -->
  <rect x="530" y="520" width="160" height="58" rx="8" fill="#2a2438" stroke="#bd93f9" stroke-width="1.8"/>
  <text x="610" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#e6d9ff">OpenSent</text>

  <!-- OpenConfirm -->
  <rect x="770" y="520" width="180" height="58" rx="8" fill="#2a2438" stroke="#bd93f9" stroke-width="1.8"/>
  <text x="860" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#e6d9ff">OpenConfirm</text>

  <!-- Established -->
  <rect x="1035" y="330" width="180" height="60" rx="8" fill="#1f2e22" stroke="#50fa7b" stroke-width="1.8"/>
  <text x="1125" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#dcffe6">Established</text>

  <!-- ===== Error / reset arrows (drawn first, under normal arrows) ===== -->
  <g fill="none" stroke="#ff5555" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#arrow-err)">
    <path d="M 220,358 C 250,280 450,210 598,178"/>
    <path d="M 220,518 C 150,380 350,230 598,190"/>
    <path d="M 585,518 C 560,400 600,260 632,200"/>
    <path d="M 840,518 C 820,380 740,250 668,196"/>
    <path d="M 1080,328 C 1000,260 800,200 705,182"/>
  </g>
  <rect x="700" y="230" width="270" height="20" fill="#202124" opacity="0.85"/>
  <text x="835" y="245" text-anchor="middle" font-size="12" fill="#ff8888">error / notification → reset to Idle</text>

  <!-- ===== Normal transition arrows ===== -->
  <g fill="none" stroke="#d7dae0" stroke-width="2" marker-end="url(#arrow)">
    <!-- Idle -> Connect -->
    <path d="M 630,208 C 480,260 320,300 245,358"/>
    <!-- Connect -> Active -->
    <path d="M 210,418 L 210,518"/>
    <!-- Active -> Connect (retry) -->
    <path d="M 250,518 L 250,418"/>
    <!-- Connect -> OpenSent (TCP success) -->
    <path d="M 300,390 C 420,430 480,470 528,518"/>
    <!-- Active -> OpenSent (TCP success) -->
    <path d="M 310,545 L 528,545"/>
    <!-- OpenSent -> OpenConfirm -->
    <path d="M 690,549 L 768,549"/>
    <!-- OpenConfirm -> Established -->
    <path d="M 920,518 C 970,470 1010,430 1050,392"/>
  </g>

  <!-- Edge labels (with backing rects for legibility) -->
  <g font-size="11" fill="#d7dae0">
    <rect x="415" y="255" width="46" height="16" fill="#202124" opacity="0.85"/>
    <text x="438" y="267" text-anchor="middle">Start</text>

    <rect x="188" y="460" width="82" height="16" fill="#202124" opacity="0.85"/>
    <text x="229" y="472" text-anchor="middle" fill="#8be9fd">TCP retry</text>

    <rect x="330" y="435" width="150" height="16" fill="#202124" opacity="0.85"/>
    <text x="405" y="447" text-anchor="middle">TCP connected, send OPEN</text>

    <rect x="345" y="530" width="110" height="16" fill="#202124" opacity="0.85"/>
    <text x="400" y="542" text-anchor="middle">TCP connected</text>

    <rect x="695" y="533" width="80" height="16" fill="#202124" opacity="0.85"/>
    <text x="735" y="545" text-anchor="middle">Receive OPEN</text>

    <rect x="935" y="435" width="120" height="16" fill="#202124" opacity="0.85"/>
    <text x="995" y="447" text-anchor="middle">Receive KEEPALIVE</text>
  </g>

  <text x="680" y="760" text-anchor="middle" font-size="12" fill="#9aa0a6">Solid arrows: normal progression — Dashed red arrows: any state resets to Idle on error or session close</text>
</svg>
